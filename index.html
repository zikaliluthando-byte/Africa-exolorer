<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Africa Explorer: Quest Across the Continent</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EBC8;--card:#FFFDF5;--ink:#1B2A2F;--muted:#55646A;--sea:#BFE3E8;--land:#D9AE5F;--line:#8C6A25;--accent:#E4572E;--good:#2E8B57;--bad:#C0392B;--btn:#0E3B43;--btntxt:#FFFDF5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10242A;--card:#173840;--ink:#F6EBC8;--muted:#B5C4C6;--sea:#0F4B57;--land:#B98B3E;--line:#F6EBC8;--btn:#F6EBC8;--btntxt:#10242A}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2{font-family:Fredoka,system-ui,sans-serif;line-height:1.15;margin:0 0 10px}
h1{font-size:2.3rem}h2{font-size:1.5rem}
.card{background:var(--card);border-radius:18px;padding:18px;border:2px solid var(--ink)}
.bar{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:10px;font-size:.95rem}
.hearts{color:var(--accent);letter-spacing:2px}
button,input{font:inherit}
.btn{display:block;width:100%;background:var(--btn);color:var(--btntxt);border:0;border-radius:12px;padding:13px 16px;margin-top:10px;font-weight:700;cursor:pointer;text-align:left}
.btn.go{text-align:center;background:var(--accent);color:#fff;font-family:Fredoka,sans-serif;font-size:1.15rem}
.btn:focus-visible,input:focus-visible,svg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.bad{background:var(--bad);color:#fff;opacity:.85}.btn.good{background:var(--good);color:#fff}
.btn:disabled{cursor:default}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);margin-top:6px}
svg.map{width:100%;height:auto;display:block;border-radius:12px;border:2px solid var(--ink);touch-action:manipulation;cursor:crosshair}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-weight:700}
.fb.ok{background:var(--good);color:#fff}.fb.no{background:var(--bad);color:#fff}.fb.info{background:var(--sea);color:var(--ink)}
.small{color:var(--muted);font-size:.9rem}
.badge{font-size:4rem;text-align:center;margin:6px 0}
.cert{text-align:center;border:4px double var(--ink)}
.badges{font-size:2rem;letter-spacing:6px;margin:8px 0}
ol{padding-left:22px}li{margin-bottom:6px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var W=450,H=435,px=function(l){return (l+30)*5},py=function(l){return (42-l)*5};
var OUT=[[-9.8,35.8],[-5.9,35.8],[-2,35.1],[3,36.8],[10,37.3],[11,33.5],[15,32.3],[20,32.2],[20,30.9],[25,31.6],[29,31],[32.3,31.3],[32.6,30],[33.8,27.2],[35.5,23.5],[36.9,22],[37.2,19.6],[39.5,15.6],[42.7,13],[43.1,11.6],[44.9,10.4],[51.3,11.8],[51,10.4],[49.5,7],[47.8,4.5],[45.3,2],[42.5,-0.8],[40.9,-2.3],[39.7,-4.1],[39.2,-6.8],[39.6,-8.9],[40.5,-10.5],[40.7,-14.5],[36.9,-17.9],[34.9,-19.8],[35.4,-22],[35.5,-24],[32.9,-26],[32.9,-28.5],[31,-29.9],[28,-33],[25.6,-34],[20,-34.8],[18.5,-34.2],[18,-31.5],[16.5,-28.6],[15.1,-26.6],[14.5,-22.9],[11.8,-17.3],[11.8,-15.8],[13.4,-12.5],[13.2,-8.8],[12.2,-5.8],[11.8,-4.5],[9.3,-1],[9.4,0.4],[9.7,2.5],[9.7,4],[8.5,4.6],[6,4.3],[3.4,6.4],[1.2,6.1],[-2,4.8],[-4,5.3],[-7.5,4.4],[-10.8,6.3],[-13.2,8.4],[-15,10.8],[-16.8,13.5],[-17.5,14.7],[-16.5,16.5],[-16,18.1],[-17,20.9],[-16,23.7],[-14.5,26],[-13,27.7],[-11.5,28.3],[-9.6,30.4],[-9.8,31.4],[-8.5,33.3],[-6.8,34],[-6,35.2]];
var MAD=[[49.3,-12],[50.4,-15.5],[49.4,-18.5],[47.1,-24.9],[45.1,-25.6],[43.9,-23],[44.4,-20],[44.1,-17],[46.3,-15.8],[48,-13.5]];
var pts=function(a){return a.map(function(p){return px(p[0])+','+py(p[1])}).join(' ')};
var L=[
{n:'Globe Trotter',e:'🌍',t:'Find Africa!',d:'Spot our continent on the map and the globe.',q:[
 {k:'mc',q:'Africa is a ___.',o:['Country','Ocean','Continent','City'],a:2,h:'It is much bigger than a country and has many countries inside it.',f:'Africa is the second largest continent after Asia.'},
 {k:'map',q:'Tap the Equator, the imaginary line around the middle of Earth.',t:{line:0,r:3},h:'It sits at 0° latitude, a little above the lowest point of the Horn of Africa.',f:'The Equator crosses Gabon, the Republic of Congo, the DRC, Uganda, Kenya and Somalia.'},
 {k:'mc',q:'A globe shows the shape of Earth more accurately than a flat world map.',o:['True','False'],a:0,h:'Earth is round, like a globe.',f:'Flat maps stretch some places to fit on paper.'},
 {k:'mc',boss:1,q:'Which continent lies directly north of Africa, across the Mediterranean Sea?',o:['Asia','Europe','Antarctica','South America'],a:1,h:'Think of Spain, Italy and Greece.',f:'At the Strait of Gibraltar, Africa and Europe are only about 14 km apart.'}]},
{n:'Ocean Explorer',e:'🌊',t:'Ocean Explorer!',d:'Africa is surrounded by water. Name the oceans and seas.',q:[
 {k:'map',q:'Tap the Atlantic Ocean, on the west coast of Africa.',t:{lon:-18,lat:2,r:10},h:'Go to the left side of the map, in the water.',f:'The Atlantic Ocean borders Africa from Morocco down to the Cape.'},
 {k:'map',q:'Tap the Indian Ocean, on the east coast of Africa.',t:{lon:53,lat:-12,r:11},h:'Go to the right side of the map, in the water.',f:'Madagascar and Zanzibar are both in the Indian Ocean.'},
 {k:'map',q:'Tap the Southern Ocean, south of Africa.',t:{lon:15,lat:-42,r:8},h:'Go to the very bottom of the map. It surrounds Antarctica.',f:'Check how your textbook treats the southern waters of Africa.'},
 {k:'map',q:'Tap the Mediterranean Sea, along the north of Africa.',t:{lon:18,lat:35.5,r:3.5},h:'It lies between Africa and Europe.',f:'The Mediterranean touches Morocco, Algeria, Tunisia, Libya and Egypt.'},
 {k:'map',boss:1,q:'Tap the Red Sea, between north-east Africa and Asia.',t:{lon:38.5,lat:20,r:3.5},h:'It is a narrow sea east of Sudan and Egypt.',f:'The Red Sea links to the Mediterranean through the Suez Canal.'}]},
{n:'Border Guard',e:'🛂',t:'Border Guard!',d:'Learn what countries and borders are.',q:[
 {k:'mc',q:'What is a country?',o:['A very large ocean','An area of land with its own government and borders','A type of map','A group of oceans'],a:1,h:'Kenya, Egypt and Ghana are examples.',f:'Africa has 54 countries.'},
 {k:'mc',q:'What is a border?',o:['A line that shows where one country ends and another begins','A road in a city','The middle of an ocean','A type of mountain'],a:0,h:'Think about the line between South Africa and Botswana.',f:'Borders can be marked by fences, rivers or only lines on a map.'},
 {k:'mc',q:'All borders are straight lines on the ground.',o:['True','False'],a:1,h:'Some borders follow rivers, lakes or mountains.',f:'Many African borders follow rivers such as the Limpopo.'},
 {k:'mc',boss:1,q:'How many countries does Africa have?',o:['12','30','54','100'],a:2,h:'It is more than 50.',f:'54 is the number recognised by the United Nations.'}]},
{n:'Country Captain',e:'🧭',t:'Country Captain!',d:'Find countries and discover their secrets.',q:[
 {k:'map',q:'Tap Kenya.',t:{lon:37.8,lat:0.5,r:4},h:'Kenya is in East Africa on the Equator.',f:'Kenya’s capital is Nairobi.'},
 {k:'map',q:'Tap South Africa.',t:{lon:24.5,lat:-29,r:6},h:'It is at the southern tip of the continent.',f:'South Africa has three capital cities: Pretoria, Cape Town and Bloemfontein.'},
 {k:'map',q:'Tap Egypt.',t:{lon:30,lat:26.5,r:5},h:'Egypt is in the north-east, beside the Red Sea.',f:'Egypt’s capital is Cairo, on the Nile River.'},
 {k:'mc',q:'Botswana is landlocked. What does landlocked mean?',o:['It has islands','It has no coastline','It has a desert','It is on the Equator'],a:1,h:'Land + locked: surrounded by other countries.',f:'Africa has 16 landlocked countries, including Botswana, Zambia, Ethiopia and Uganda.'},
 {k:'mc',boss:1,q:'Which of these countries is on the Equator?',o:['Egypt','Namibia','Botswana','Kenya'],a:3,h:'It is in East Africa.',f:'Gabon, Uganda and Somalia are also on the Equator.'}]},
{n:'Island Hopper',e:'🏝️',t:'Island Hopper!',d:'Two special places are waiting: Madagascar and Zanzibar!',q:[
 {k:'mc',q:'Madagascar is both a country and an island.',o:['True','False'],a:0,h:'It lies off the south-east coast of Africa.',f:'Madagascar is the largest island in Africa. Its capital is Antananarivo.'},
 {k:'mc',q:'Zanzibar is a country on its own.',o:['True','False'],a:1,h:'It belongs to another country.',f:'Zanzibar is an island region of Tanzania.'},
 {k:'map',q:'Tap Madagascar.',t:{lon:46.8,lat:-19,r:6},h:'Look for the big island in the Indian Ocean.',f:'Madagascar is home to lemurs found nowhere else on Earth.'},
 {k:'mc',boss:1,q:'Which statement is correct?',o:['Madagascar and Zanzibar are both countries','Madagascar is a country and an island, and Zanzibar is an island of Tanzania','Zanzibar is a country and Madagascar is part of Mozambique','Neither is an island'],a:1,h:'One is a country. One belongs to a country.',f:'Both are in the Indian Ocean.'}]}];
var MAX=0;L.forEach(function(l){MAX+=l.q.length*10});
var S={name:'',li:0,qi:0,hearts:3,score:0,ls:0,tries:0,done:false,badges:[]};
var app=document.getElementById('app');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function put(h){app.innerHTML=h;window.scrollTo(0,0)}
function start(){S={name:S.name,li:0,qi:0,hearts:3,score:0,ls:0,tries:0,done:false,badges:[]};
put('<div class="card"><h1>Africa Explorer</h1><h2>Quest Across the Continent</h2><p>The Explorer’s Guild needs a new map-maker. Is it you?</p><label for="nm">Your name</label><input id="nm" maxlength="30" autocomplete="off" value="'+esc(S.name)+'"><button class="btn go" id="b">Start</button></div>');
document.getElementById('b').onclick=function(){S.name=document.getElementById('nm').value.trim()||'Explorer';how()}}
function how(){put('<div class="card"><h2>Welcome, '+esc(S.name)+'!</h2><p>Your mission:</p><ol><li>Answer map questions in 5 levels.</li><li>Correct on the first try = 10 points. Second try = 5 points.</li><li>You have 3 hearts. Wrong answers on boss questions cost a heart.</li><li>Finish a level to win its badge.</li></ol><button class="btn go" id="b">Go to Level 1</button></div>');document.getElementById('b').onclick=intro}
function intro(){var l=L[S.li];S.qi=0;S.ls=0;S.hearts=3;put('<div class="card"><div class="badge">'+l.e+'</div><h2>Level '+(S.li+1)+': '+l.t+'</h2><p>'+l.d+'</p><button class="btn go" id="b">Begin</button></div>');document.getElementById('b').onclick=ask}
function bar(){var l=L[S.li];return '<div class="bar"><span>Level '+(S.li+1)+' · Question '+(S.qi+1)+' of '+l.q.length+'</span><span class="hearts" aria-label="'+S.hearts+' hearts">'+'♥'.repeat(S.hearts)+'</span><span>'+S.score+' pts</span></div>'}
function ask(){var q=L[S.li].q[S.qi];S.tries=0;S.done=false;
var h='<div class="card">'+bar()+(q.boss?'<p class="small"><b>Boss question!</b></p>':'')+'<h2>'+q.q+'</h2>';
if(q.k==='map'){h+='<svg class="map" id="mp" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Map of Africa. Tap the answer."><rect width="'+W+'" height="'+H+'" fill="var(--sea)"/><polygon points="'+pts(OUT)+'" fill="var(--land)" stroke="var(--line)" stroke-width="1.5"/><polygon points="'+pts(MAD)+'" fill="var(--land)" stroke="var(--line)" stroke-width="1.5"/><text x="150" y="12" font-size="11" fill="var(--muted)">Europe</text><text x="385" y="55" font-size="11" fill="var(--muted)">Asia</text><g id="mk"></g></svg>'}
else{h+=q.o.map(function(o,i){return '<button class="btn opt" data-i="'+i+'">'+o+'</button>'}).join('')}
h+='<div id="fb"></div></div>';put(h);
if(q.k==='map'){document.getElementById('mp').onclick=function(e){if(S.done)return;var r=this.getBoundingClientRect();var x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;var lon=x/5-30,lat=42-y/5;
var t=q.t,ok=t.line!==undefined?Math.abs(lat-t.line)<=t.r:Math.hypot(lon-t.lon,lat-t.lat)<=t.r;
mark(x,y,ok?'var(--good)':'var(--bad)',false);res(ok,q)}}
else{[].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){if(S.done)return;var i=+b.dataset.i,ok=i===q.a;b.classList.add(ok?'good':'bad');b.disabled=true;res(ok,q)}})}}
function mark(x,y,c,ring){var g=document.getElementById('mk');if(g)g.insertAdjacentHTML('beforeend','<circle cx="'+x+'" cy="'+y+'" r="'+(ring?18:7)+'" fill="'+(ring?'none':c)+'" stroke="'+c+'" stroke-width="4"/>')}
function reveal(q){if(q.k==='map'){var t=q.t;if(t.line!==undefined){document.getElementById('mk').insertAdjacentHTML('beforeend','<line x1="0" x2="'+W+'" y1="'+py(t.line)+'" y2="'+py(t.line)+'" stroke="var(--good)" stroke-width="3" stroke-dasharray="6 4"/>')}else mark(px(t.lon),py(t.lat),'var(--good)',true)}
else{var b=document.querySelector('.opt[data-i="'+q.a+'"]');b.classList.remove('bad');b.classList.add('good')}}
function res(ok,q){var fb=document.getElementById('fb');var last=S.qi===L[S.li].q.length-1;var next='<button class="btn go" id="nx">'+(last?'Finish level':'Next question')+'</button>';
if(ok){var p=S.tries===0?10:5;S.score+=p;S.ls+=p;S.done=true;if(q.k==='map')reveal(q);fb.innerHTML='<div class="fb ok">'+(S.tries===0?'Well done, Explorer! +10 points.':'Good job for trying again! +5 points.')+'</div><div class="fb info">Did you know? '+q.f+'</div>'+next;document.getElementById('nx').onclick=adv;return}
S.tries++;if(q.boss)S.hearts--;
if(S.hearts<=0){S.done=true;S.score-=S.ls;fb.innerHTML='<div class="fb no">Oh no, you are out of hearts! Try this level again.</div><button class="btn go" id="nx">Retry level</button>';document.getElementById('nx').onclick=intro;return}
if(S.tries>=2){S.done=true;reveal(q);fb.innerHTML='<div class="fb no">Not this time. The answer is shown above (0 points).</div><div class="fb info">Did you know? '+q.f+'</div>'+next;document.getElementById('nx').onclick=adv;return}
fb.innerHTML='<div class="fb no">Not quite.'+(q.boss?' You lost a heart.':'')+'</div><div class="fb info">Hint: '+q.h+' Try again!</div>';
var hs=document.querySelector('.hearts');if(hs){hs.textContent='♥'.repeat(S.hearts)}}
function adv(){var l=L[S.li];if(S.qi<l.q.length-1){S.qi++;ask()}else badge()}
function badge(){var l=L[S.li];if(S.badges.indexOf(l.e)<0)S.badges.push(l.e);var last=S.li===L.length-1;
put('<div class="card" style="text-align:center"><p class="small">Level '+(S.li+1)+' complete!</p><div class="badge">'+l.e+'</div><h2>You earned the '+l.n+' badge!</h2><p>Score so far: '+S.score+' points</p><button class="btn go" id="b">'+(last?'Get my certificate':'Next level')+'</button></div>');
document.getElementById('b').onclick=function(){if(last)cert();else{S.li++;intro()}}}
function cert(){var p=S.score/MAX,r=p>=.85?'Master Map-Maker':p>=.6?'Skilled Explorer':p>=.3?'Junior Explorer':'Explorer in Training';
put('<div class="card cert"><h1>Explorer Certificate</h1><p>This certifies that</p><h2>'+esc(S.name)+'</h2><p>is an official Africa Map-Maker.</p><div class="badges" aria-label="Badges earned">'+S.badges.join(' ')+'</div><p><b>Score: '+S.score+' / '+MAX+'</b><br>Rank: '+r+'</p><button class="btn go" id="b">Play again</button></div>');document.getElementById('b').onclick=start}
start();
</script>
</body>
</html>
